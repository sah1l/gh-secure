version: 1
visibility: public
license: mit
merge_strategy:
  allow_squash: true
  allow_merge: false
  allow_rebase: false
delete_branch_on_merge: true
rulesets:
  - name: Protect main
    target: branch
    enforcement: active
    branches:
      - ~DEFAULT_BRANCH~
    required_reviews: 1
    dismiss_stale_reviews: true
    prevent_deletion: true
    prevent_force_push: true
    allowed_merge_methods:
      - squash
    admin_bypass: true
security:
  vulnerability_alerts: true
  automated_security_fixes: true
  secret_scanning: true
  secret_scanning_push_protection: true
  dependabot_config: true
files:
  - CONTRIBUTING.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - CODEOWNERS
